[project]
name = "mercury_integration"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Mercury Bank integration: billing, payroll ACH, bank sync, reconciliation, and GL coding"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["version"]
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
responses = "~=0.23"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "E501", # line too long
    "E741", # ambiguous variable name
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ssort]
skip = ["TYPE_CHECKING"]
